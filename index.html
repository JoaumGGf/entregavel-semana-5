
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projeto - Consumo de APIs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:disabled {
            background-color: gray;
        }

        .erro {
            color: red;
        }

        .sucesso {
            color: green;
        }

        li {
            margin: 5px;
        }

        img {
            width: 120px;
        }
    </style>
</head>

<body>

    <h1>Mini Projeto - Consumo de APIs</h1>

    <section>
        <h2>Buscador de CEP</h2>

        <form id="formCep">
            <input
                type="text"
                id="cep"
                placeholder="Digite o CEP"
                maxlength="9"
            >

            <button type="submit" id="btnCep">
                Buscar CEP
            </button>
        </form>

        <p id="statusCep" role="status" aria-live="polite"></p>

        <dl id="resultadoCep"></dl>

        <h3>Histórico de CEPs</h3>
        <ul id="historicoCep"></ul>
    </section>

    <section>
        <h2>Mini Pokédex</h2>

        <form id="formPokemon">
            <input
                type="text"
                id="pokemon"
                placeholder="Nome do Pokémon"
            >

            <button type="submit" id="btnPokemon">
                Buscar Pokémon
            </button>
        </form>

        <p id="statusPokemon" role="status" aria-live="polite"></p>

        <div id="resultadoPokemon"></div>
    </section>

    <script src="app.js"></script>

</body>
</html>
